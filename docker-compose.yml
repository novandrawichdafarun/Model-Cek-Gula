version: '3.8'

services:
  cek-gula-api:
    build: .
    container_name: cek-gula-api
    ports:
      - "8000:8000"
    volumes:
      - ./best_model.keras:/app/best_model.keras:ro
      - ./model_cek_gula.keras:/app/model_cek_gula.keras:ro
      - ./nutrisi_jajanan.csv:/app/nutrisi_jajanan.csv:ro
      - ./.env:/app/.env:ro
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    command: uvicorn Main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped